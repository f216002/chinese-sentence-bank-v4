# ---- 全球中文班招生頁：靜態產生 ----
# 每 15 分鐘讀取 Firestore `enrollPages`（已發布），
# 以公版樣板渲染每位老師的 enroll/{slug}/index.html 並推回 main，
# GitHub Pages 隨即上線。家長看到的是純靜態頁，零資料庫讀取。
name: Generate enrollment pages

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enroll-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate pages
        run: node tools/generate-enroll-pages.js

      - name: Commit and push if changed
        run: |
          git config user.name "enroll-bot"
          git config user.email "enroll-bot@users.noreply.github.com"
          git add enroll
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "招生頁自動更新 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push 衝突，重試 $i/3…"
            sleep 10
          done
